<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원윤메디팜 주문</title>
<meta name="description" content="원윤메디팜 거래처 전용 의약품·의료소모품 주문 사이트">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="icon" type="image/png" href="assets/mark-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="assets/fonts/Paperlogy-6SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/*
  원윤메디팜 — "백자와 금박" 콘셉트
  Layout: 흰 레일(관리자) / 흰 상단 띠(거래처) + 옅은 돌빛 작업면. 로그인은 로고 테두리를 닮은 금선 액자.
          내용은 카드 상자 대신 종이 한 장 위의 문서처럼, 표는 가는 선으로. 골드는 금박처럼 마크와 '지금 위치'에만.
*/
/* 페이퍼로지(Paperlogy, PT& · SIL OFL 1.1): 제목·워드마크·큰 숫자. 본문은 프리텐다드. 글꼴 파일은 assets/fonts에 함께 둠 */
@font-face{font-family:'Paperlogy';font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/Paperlogy-5Medium.woff2) format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/Paperlogy-6SemiBold.woff2) format('woff2')}
:root{
  /* 백자(白磁)와 금박 — 밝은 흰 바탕, 먹색 글자, 금빛은 마크와 '지금 위치'에만 */
  --page:#F4F4F1; --sheet:#FFFFFF; --sunken:#F1F0EC; --rule:#E7E5DF; --rule-2:#D4D1C8;
  --ink:#24221E; --ink-2:#55514A; --ink-3:#736E65;
  --gold:#B38C52; --gold-ink:#7E602B; --gold-tint:#F7F0E4; --gold-line:#E4D5BA;
  --primary:#2A2723; --primary-hover:#141310; --primary-ink:#FFFFFF;
  --s-new:#B14A2F; --s-conf:#3D5C82; --s-ship:#7E602B; --s-done:#7A766E; --s-cancel:#8E2F2F;
  --ok:#2F5E86; --warn:#A0640C; --bad:#9B3A3A; --info:#4E5D73;
  --ok-soft:#E8EFF6; --warn-soft:#F8EFDD; --bad-soft:#F7E7E5; --info-soft:#EEF0F3;
  --scrim:rgba(36,32,26,.36); --shadow:0 24px 60px rgba(36,32,26,.16);
  --f-head:'Paperlogy','Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-word:var(--f-head);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--page);color:var(--ink);font:400 14.5px/1.6 var(--f-sans);letter-spacing:-.003em;-webkit-font-smoothing:antialiased;font-feature-settings:"ss06" 1}
body.modal-open{overflow:hidden}
img,svg{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--gold-ink)}
::selection{background:var(--gold-tint)}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--ink-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabnum{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
/* 부가 정보: 가운뎃점 대신 가는 세로선으로 구분 */
.meta{display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:0;max-width:100%}
.meta>span+span{padding-left:10px;border-left:1px solid var(--rule-2);line-height:1.1}
.oc-no{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* mark & wordmark */
.mark{display:inline-block;flex:none;color:var(--gold);line-height:0}
.mark svg{width:100%;height:auto;display:block}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>div{min-width:0}
.wm{font-family:var(--f-word);font-weight:500;font-size:15px;letter-spacing:.2em;line-height:1.1;white-space:nowrap}
.wm-sub{font-size:12px;letter-spacing:.01em;white-space:nowrap;margin-top:3px;opacity:.72}
.tagline{font-family:var(--f-sans);font-size:10.5px;letter-spacing:.36em;color:var(--gold-ink);font-weight:500;text-transform:uppercase}

/* admin shell — 약장 그린 레일 */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:30px;padding:28px 16px 20px;background:var(--sheet);color:var(--ink);border-right:1px solid var(--rule)}
.side .brand{padding:0 12px;flex-direction:column;align-items:flex-start;gap:16px}
.side .wm{font-size:12.5px;letter-spacing:.17em}
.side .wm-sub{color:var(--gold-ink);opacity:1;margin-top:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:4px;background:transparent;color:var(--ink-2);font-weight:500;font-size:14.5px;text-align:left;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.nav-i:hover{color:var(--ink);background:var(--sunken)}
.nav-i.on{color:var(--ink);background:var(--gold-tint);font-weight:600;box-shadow:inset 2px 0 0 var(--gold)}
.cnt{min-width:22px;padding:0 7px;border-radius:999px;background:var(--gold-ink);color:#fff;font-size:11.5px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:20px}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--rule);display:grid;gap:6px;font-size:12.5px;color:var(--ink-3)}
.side-foot b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px;justify-self:start}
.linkbtn:hover{color:var(--ink)}
.main{min-width:0;padding-block:40px 80px;padding-inline:44px;max-width:1380px;width:100%}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.ph h1{font-family:var(--f-head);font-weight:600;font-size:29px;letter-spacing:-.01em;line-height:1.3}
.ph-sub{margin-top:8px;color:var(--ink-3);font-size:14px;max-width:70ch}
.ph-act{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spacer{flex:1}

/* controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 16px;border:1px solid var(--rule-2);border-radius:4px;background:var(--sheet);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn.sm{min-height:32px;padding:5px 12px;font-size:13px}
.btn.lg{min-height:50px;font-size:15.5px;padding:12px 22px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:4px;background:var(--sheet);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--ink-3);opacity:.8}
.inp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 28%,transparent)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.inp.sm{min-height:32px;padding:4px 9px;font-size:13.5px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.inp.lg{min-height:50px;font-size:15.5px;padding:12px 14px}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:440px}
.search .inp{padding-left:36px}
.search::before{content:"";position:absolute;left:13px;top:50%;width:11px;height:11px;margin-top:-7px;border:1.5px solid var(--ink-3);border-radius:50%}
.search::after{content:"";position:absolute;left:24px;top:50%;width:6px;height:1.5px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px 18px}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.fld em{font-style:normal;color:var(--bad)}
.hint{font-size:13px;color:var(--ink-3);line-height:1.55}
.check{display:inline-flex;align-items:center;gap:9px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--primary)}
/* 탭: 상자 대신 글자 + 금박 밑줄 */
.seg{display:flex;flex-wrap:wrap;gap:4px 26px;border-bottom:1px solid var(--rule);flex:1 1 100%}
.seg button{border:0;background:transparent;padding:10px 0 11px;margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:500;font-size:14.5px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.seg button .c{margin-left:6px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:999px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

/* surfaces — 종이 한 장 */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.panel-h h2{font-family:var(--f-head);font-size:17px;font-weight:500;letter-spacing:0}
.panel-b{padding:16px 20px}
/* 요약 수치: 상자 대신 장부 한 줄 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.kpi{padding:20px 22px;display:grid;gap:6px;text-align:left;color:inherit;font:inherit;background:transparent;border:0;border-left:1px solid var(--rule);margin-left:-1px}
button.kpi{cursor:pointer;transition:background .15s}
button.kpi:hover{background:var(--sunken)}
.kpi .k{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.005em}
.kpi .v small{font-family:var(--f-sans);font-size:13.5px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi.alert .v{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--rule);min-width:0}
.li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.click{cursor:pointer}
.li.click:hover{background:var(--sunken)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:15.5px;font-family:var(--f-head);font-weight:500}
.empty-s{padding:22px 4px;color:var(--ink-3);font-size:13.5px}
.note{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:13px 16px;border-radius:4px;background:var(--sunken);color:var(--ink-2);font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:700}
.steps-help{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);font-size:14px}

/* tables — 가는 선 장부 */
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.panel .tbl-wrap{border:0;border-radius:0;background:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
.tbl-wrap>table{min-width:860px}
.ti table,.ocard .tbl-wrap>table,.dlg .tbl-wrap>table{min-width:0}
td .t{min-width:150px}
td .cw{min-width:120px}
th{padding:12px 16px;border-bottom:1px solid var(--rule-2);text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;background:transparent}
td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunken)}
td .t{font-weight:600}
td .s{font-size:12.5px;color:var(--ink-3)}

/* 상태: 알약 대신 작은 점 + 글자 */
.pill{display:inline-flex;align-items:center;gap:7px;padding:0;background:none;font-size:13.5px;font-weight:600;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-new{color:var(--s-new)} .st-conf{color:var(--s-conf)} .st-ship{color:var(--s-ship)} .st-done{color:var(--s-done)} .st-cancel{color:var(--s-cancel)}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border:1px solid var(--rule-2);border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink-2);background:transparent;line-height:1.6}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.tag.gold{color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--gold);opacity:.55}
.chart .bar.today{opacity:1}
.chart .tick{fill:var(--ink-3);font-size:11px;font-family:var(--f-sans)}
.chart .base{stroke:var(--rule-2);stroke-width:1}
.meter{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--warn)}
.meter.bad i{background:var(--bad)}

/* shop — 거래처 주문 */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:28px;align-items:start}
.shop-tools{display:grid;gap:14px}
.plist{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) 124px 96px 144px;grid-template-areas:"fav info price stock qty";align-items:center;gap:10px 16px;padding:15px 20px;border-bottom:1px solid var(--rule);transition:background .15s}
.prow:last-child{border-bottom:0}
.prow.in{background:color-mix(in srgb,var(--gold-tint) 55%,var(--sheet))}
.fav{grid-area:fav;width:24px;height:24px;border:0;background:transparent;color:var(--rule-2);cursor:pointer;border-radius:4px;padding:3px;display:grid;place-items:center}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.fav.on{color:var(--gold)}
.fav.on svg{fill:currentColor}
.fav:hover{color:var(--gold)}
.pinfo{grid-area:info;min-width:0}
.pname{font-weight:600;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.pprice{grid-area:price;text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
.pprice b{font-size:16px;font-weight:600}
.pprice .u{font-size:12.5px;color:var(--ink-3);margin-left:1px}
.pprice s{display:block;font-size:12px;color:var(--ink-3)}
.pstock{grid-area:stock;display:grid;justify-items:start;gap:1px}
/* 주문 가능 여부: 점 + 글자 */
.avail{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.avail::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.avail.ok{color:var(--ok)} .avail.low{color:var(--warn)} .avail.out{color:var(--bad)}
.pstock small{font-size:12px;color:var(--ink-3);padding-left:13px;white-space:nowrap}
.prow.out .pname{color:var(--ink-2)}
.prow.out .pprice b{color:var(--ink-3)}
.pact{grid-area:qty;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.pact .s{font-size:12px;color:var(--ink-3)}
.reqline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:14px 18px;border:1px dashed var(--rule-2);border-radius:6px;color:var(--ink-2);font-size:14px;background:var(--sheet)}
.rq-memo{margin-top:6px;font-size:13.5px;color:var(--ink)}
.rq-memo .muted{margin-right:6px}
.cl.out .cl-n{color:var(--ink-3)}
.cl.out .tag{justify-self:end}
.ctabs .cnt{margin-left:6px;vertical-align:1px}
.qty{grid-area:qty;display:flex;justify-self:end;height:36px;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden;background:var(--sheet)}
.qty button{width:34px;border:0;background:transparent;color:var(--ink-2);font-size:17px;cursor:pointer;line-height:1}
.qty button:hover{background:var(--sunken);color:var(--ink)}
.qty input{width:70px;border:0;border-inline:1px solid var(--rule);text-align:center;background:transparent;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.qty input:focus{outline:none;background:var(--gold-tint)}
.prow.in .qty{border-color:var(--gold)}
.cart{position:sticky;top:96px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.cart-h{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.cart-h h2{font-family:var(--f-head);font-size:19px;font-weight:500;letter-spacing:0}
.cart-lines{overflow:auto;flex:1;min-height:60px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 20px;border-bottom:1px solid var(--rule);font-size:13.5px}
.cl-n{font-weight:600;overflow-wrap:anywhere}
.cl-q{color:var(--ink-3);font-variant-numeric:tabular-nums}
.cl-a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cl-x{justify-self:end;border:0;background:none;color:var(--ink-3);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.cart-f{display:grid;gap:12px;padding:16px 20px 20px;border-top:1px solid var(--rule)}
.sum{display:grid;gap:4px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sum .tot{font-size:15px;font-weight:600;color:var(--ink);margin-top:8px;padding-top:10px;border-top:1px solid var(--rule);align-items:baseline}
.sum .tot span:last-child{font-family:var(--f-head);font-size:24px;font-weight:500;letter-spacing:.005em;font-variant-numeric:tabular-nums lining-nums}
.cartbar{display:none}
.again{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;background:transparent;border:1px solid var(--rule-2);border-radius:4px;font-size:13.5px;color:var(--ink-2)}

/* customer shell — 그린 상단 띠 */
.ctop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);color:var(--ink);border-bottom:1px solid var(--rule)}
.ctop-in{max-width:1300px;margin:0 auto;padding-inline:32px;padding-block:0;min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 32px}
.ctop-who{font-size:13.5px;margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3)}
.ctop-who b{color:var(--ink);font-weight:600}
.ctop-who .btn.ghost{color:var(--ink-2)}
.ctabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.ctabs button{border:0;background:transparent;padding:0;min-height:72px;font-weight:500;font-size:15px;color:var(--ink-3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.ctabs button:hover{color:var(--ink)}
.ctabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.cmain{max-width:1300px;margin:0 auto;padding-inline:32px;padding-block:32px 90px;display:grid;gap:22px}
.banner{padding:13px 18px;border-radius:4px;background:var(--sheet);border:1px solid var(--rule);color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 24px}
.banner b{font-weight:600;color:var(--gold-ink);margin-right:6px}
.ocard{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.ocard-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 20px}
.ocard-b{border-top:1px solid var(--rule)}
.steps{display:flex;align-items:center;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:6px}
.steps span+span::before{content:"";width:20px;height:1px;background:var(--rule-2);margin:0 8px}
.steps .done{color:var(--ink);font-weight:600}
.steps .done i{background:var(--s-ship);border-color:var(--s-ship)}
.steps i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--rule-2)}

/* gate — 로그인: 왼쪽 약장 그린 판에 금박 WY 테두리 */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr)}
.gate-brand{position:relative;overflow:hidden;background:var(--sheet);color:var(--ink);border-right:1px solid var(--rule);padding:64px 64px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.gate-brand::before{content:"";position:absolute;inset:22px;border:1px solid var(--gold-line);border-radius:18px;pointer-events:none}
.gate-motif{position:absolute;inset:22px;border-radius:18px;overflow:hidden;color:var(--gold);opacity:.09;pointer-events:none;line-height:0}
.gate-motif rect{display:none}
.gate-motif svg{position:absolute;max-width:none;width:min(900px,200%);height:auto;right:-86%;bottom:-38%}
.gate-id{position:relative;display:grid;justify-items:start;gap:16px}
.gate-id .wm{font-size:25px;letter-spacing:.2em;color:var(--ink)}
.gate-id .tagline{margin-top:-6px}
.gate-note{position:relative;font-family:var(--f-head);font-weight:500;font-size:18px;line-height:1.7;letter-spacing:.005em;color:var(--ink-2);max-width:22ch}
.gate-main{display:grid;place-items:center;padding:48px 32px}
.gate-card{width:min(400px,100%);display:grid;gap:20px}
.gate-card h1{font-family:var(--f-head);font-size:28px;font-weight:600;letter-spacing:-.01em}
.gate-card .lead{color:var(--ink-3);font-size:14.5px}
.gate-foot{font-size:13px;color:var(--ink-3);line-height:1.6}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-3)}
.loading i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule-2);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 세금계산서 미리보기 — 전자세금계산서(공급자 보관용) 붉은 선 양식 */
.ti{border:1.5px solid #B23A45;border-radius:4px;color:var(--ink);font-size:13px;overflow-x:auto;background:var(--sheet)}
.ti table{min-width:640px;font-size:13px}
.ti th,.ti td{border:1px solid color-mix(in srgb,#B23A45 45%,transparent);padding:7px 9px;color:var(--ink)}
.ti th{background:color-mix(in srgb,#B23A45 6%,var(--sheet));color:#A2333D;font-weight:500;white-space:nowrap}
.ti .ti-title{font-family:var(--f-head);font-size:19px;font-weight:600;text-align:center;color:#A2333D;letter-spacing:.32em;padding:12px}
.ti .side-h{writing-mode:vertical-rl;text-align:center;letter-spacing:.3em;width:30px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px 22px;font-size:14px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:12.5px;color:var(--ink-3)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.sec-t{font-family:var(--f-head);font-size:15px;font-weight:500;color:var(--ink)}
.sp-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.secret{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:14px 16px;border-radius:4px;background:var(--gold-tint);color:var(--ink)}
.secret code{font-family:var(--f-sans);font-size:15px;font-weight:700;letter-spacing:.04em}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;backdrop-filter:blur(2px)}
.dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;width:min(700px,calc(100vw - 32px));max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{width:min(1060px,calc(100vw - 32px))}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 26px 16px;border-bottom:1px solid var(--rule)}
.dlg-h h2{font-family:var(--f-head);font-size:21px;font-weight:600;letter-spacing:-.005em;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dlg-h h2 .mono{font-family:var(--f-sans);font-size:17px;font-weight:600;color:var(--ink)}
.dlg-h .sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.dlg-b{padding:22px 26px;overflow:auto;display:grid;gap:18px;min-height:0}
.dlg-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 26px;border-top:1px solid var(--rule);background:var(--sheet)}
.x{border:0;background:transparent;width:34px;height:34px;border-radius:4px;font-size:22px;font-weight:300;line-height:1;color:var(--ink-3);cursor:pointer;flex:none}
.x:hover{background:var(--sunken);color:var(--ink)}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:4px;background:var(--primary);color:var(--primary-ink);font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(36,32,26,.22);transition:opacity .25s,transform .25s}
.toast::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.toast.bad{background:#5E2620;color:#F7E9E5}
.toast.bad::before{background:#F0A090}
.toast.out{opacity:0;transform:translateY(6px)}

@media (max-width:1100px){
  .shop{grid-template-columns:minmax(0,1fr)}
  .cart{position:static;max-height:none}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -8px 24px rgba(36,32,26,.07)}
  .cartbar .cb-t{flex:1;min-width:0;font-weight:600;font-variant-numeric:tabular-nums}
  .has-cartbar{padding-bottom:90px}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .main{padding-inline:28px}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;gap:12px;padding:14px 16px 6px;border-right:0;border-bottom:1px solid var(--rule)}
  .side .brand{padding:0;flex-direction:row;align-items:center;gap:12px}
  .side .wm-sub{margin-top:3px}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;margin-inline:-16px;padding-inline:12px;padding-bottom:6px;scrollbar-width:none}
  .nav-i{width:auto;flex:none;padding:8px 12px}
  .side-foot{display:none}
  .main{padding-inline:16px;padding-block:24px 80px}
  .ph h1{font-size:25px}
  .ctop-in{padding-inline:16px;min-height:0;padding-block:12px 0;gap:6px 18px}
  .ctabs{flex-basis:100%;order:3;gap:22px;margin-inline:-16px;padding-inline:16px}
  .ctabs button{min-height:46px;font-size:14.5px}
  .ctop-who{margin-left:auto}
  .cmain{padding-inline:16px;padding-block:20px 90px}
  .gate{grid-template-columns:minmax(0,1fr)}
  .gate-brand{padding:36px 30px 32px;gap:20px;min-height:0;border-right:0;border-bottom:1px solid var(--rule)}
  .gate-brand::before{inset:12px;border-radius:12px}
  .gate-motif{inset:12px;border-radius:12px}
  .gate-motif svg{width:420px;right:-130px;bottom:-150px}
  .gate-id{grid-template-columns:auto 1fr;align-items:center;gap:6px 14px}
  .gate-id .mark{grid-row:span 2;width:48px!important}
  .gate-id .wm{font-size:17px;letter-spacing:.16em}
  .gate-id .tagline{margin-top:0;font-size:9.5px;letter-spacing:.28em}
  .gate-note{font-size:16px;max-width:none}
  .gate-main{place-items:start center;padding:32px 20px 48px}
}
@media (max-width:640px){
  .prow{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"fav info info" "fav price qty" "fav stock qty";padding:14px 16px}
  .pprice{text-align:left;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .pprice s{display:inline}
  .pstock{text-align:left}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:16px;border-top:1px solid var(--rule);margin-top:-1px}
  .kpi .v{font-size:23px}
  .dlg{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:calc(100dvh - 24px);border-radius:10px 10px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg.wide{width:100%}
  .dlg-h,.dlg-b,.dlg-f{padding-inline:18px}
  .sp-row{grid-template-columns:minmax(0,1fr) 96px auto}
  .ctop-who .muted{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="gate"><aside class="gate-brand"><div class="gate-id"><span class="mark" style="width:60px"><img src="assets/mark.svg" alt="" width="60" height="58"></span><div class="wm">WONYUN MEDIPHARM</div><div class="tagline">Pharmaceutical Wholesale</div></div><p class="gate-note">약국·병의원 거래처 전용<br>의약품·의료소모품 주문</p></aside><main class="gate-main"><div class="gate-card"><div class="loading"><i></i>불러오는 중</div></div></main></div></div>
<div id="modal"></div>
<div id="toast" class="toasts" role="status" aria-live="polite"></div>
<input type="file" id="xlsx-in" accept=".xlsx,.xls,.csv" hidden>
<noscript><p style="padding:24px">자바스크립트를 켜야 주문 사이트를 쓸 수 있어요.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="app.js?v=4"></script>
</body>
